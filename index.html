<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ToS Boss Tracker — Live</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--bg2:#0d0f1a;--panel:#161828;
  --border:#252840;--border2:#353860;
  --text:#d0cae8;--soft:#9890b8;--muted:#555070;--muted2:#2a2945;
  --gold:#c9a84c;--cream:#f0ead8;
  --col-wait:#6888cc;--col-soon:#d4a040;--col-p1:#6ecf95;--col-late:#d45868;
  --mono:'JetBrains Mono',monospace;
  --disp:'Cinzel',serif;
  --body:'Inter',system-ui,sans-serif;
}
html,body{height:100%;min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 10% 0%,#0b1c10 0%,transparent 60%),
             radial-gradient(ellipse 45% 55% at 90% 100%,#0c0e20 0%,transparent 60%)}
body>*{position:relative;z-index:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:rgba(9,9,15,.97);border-bottom:1px solid var(--border);backdrop-filter:blur(18px)}
.hdr{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px}
.logo-leaf{font-size:30px;animation:sway 5s ease-in-out infinite;filter:drop-shadow(0 0 8px #6ecf9577)}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.logo-name{font-family:var(--disp);font-size:20px;letter-spacing:4px;color:var(--gold);line-height:1;text-shadow:0 0 30px #c9a84c44}
.logo-sub{font-family:var(--body);font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:3px;font-weight:500;text-transform:uppercase}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-pill{display:flex;align-items:center;gap:6px;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--col-late);transition:background .3s}
.status-dot.live{background:var(--col-p1);box-shadow:0 0 6px var(--col-p1);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.count-lbl{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.snd-btn{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.5px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:all .15s}
.snd-btn:hover{border-color:var(--border2);color:var(--text)}
.snd-btn.on{border-color:#c9a84c88;color:var(--gold);background:#c9a84c11}
.vol-slider{width:70px;height:5px;background:var(--muted2);border-radius:3px;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--gold);border-radius:50%;cursor:pointer;border:none;box-shadow:0 0 4px #c9a84c66}
.vol-slider::-moz-range-thumb{width:13px;height:13px;background:var(--gold);border-radius:50%;cursor:pointer;border:none}

/* ── FILTER BAR ── */
.bar{max-width:1200px;margin:0 auto;padding:7px 24px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;border-top:1px solid var(--border)}
.fb{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.5px;padding:4px 14px;border-radius:20px;border:1px solid var(--muted2);background:none;color:var(--muted);cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--border2);color:var(--text)}
.fb.on{background:#c9a84c18;border-color:var(--gold);color:var(--gold)}
.fb[data-f="soon"].on{background:#d4a04018;border-color:var(--col-soon);color:var(--col-soon)}
.fb[data-f="p1"].on{background:#6ecf9518;border-color:var(--col-p1);color:var(--col-p1)}
.fb[data-f="late"].on{background:#d4586818;border-color:var(--col-late);color:var(--col-late)}
.fbc{font-size:10px;opacity:.65}
.srch{margin-left:auto;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:4px 14px;font-family:var(--mono);font-size:12px;width:180px;outline:none}
.srch:focus{border-color:var(--gold)}
.srch::placeholder{color:var(--muted2)}

/* ── GRID ── */
main{max-width:1200px;margin:0 auto;padding:20px 24px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
#empty{display:none;text-align:center;padding:80px 20px;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:2px}
#empty.show{display:block}

/* ── CARD ── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px 13px;position:relative;overflow:hidden;animation:cardIn .26s cubic-bezier(.34,1.3,.64,1);transition:border-color .4s,box-shadow .4s}
@keyframes cardIn{from{opacity:0;transform:translateY(9px) scale(.96)}to{opacity:1;transform:none}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0;transition:background .5s}
.card[data-s="wait"]{border-color:#252840}
.card[data-s="wait"]::before{background:linear-gradient(90deg,transparent,var(--col-wait),transparent)}
.card[data-s="soon"]{border-color:#4a3800;box-shadow:0 0 18px #d4a04022}
.card[data-s="soon"]::before{background:linear-gradient(90deg,transparent,var(--col-soon),transparent)}
.card[data-s="p1"]{border-color:#183328;background:linear-gradient(145deg,#0b1a10 0%,var(--panel) 55%);box-shadow:0 0 22px #6ecf9522}
.card[data-s="p1"]::before{background:linear-gradient(90deg,transparent,var(--col-p1),transparent)}
.card[data-s="late"]{border-color:#3a1218;animation:cardIn .26s ease,glowLate 1.8s ease-in-out infinite}
.card[data-s="late"]::before{background:linear-gradient(90deg,transparent,var(--col-late),transparent)}
@keyframes glowLate{0%,100%{box-shadow:0 0 14px #d4586833}50%{box-shadow:0 0 32px #d4586866}}
.card[data-s="miss"]{border-color:#333355;opacity:.65;background:repeating-linear-gradient(-45deg,#0e0f18 0px,#0e0f18 8px,#111320 8px,#111320 16px) !important}
.card[data-s="miss"]::before{background:linear-gradient(90deg,transparent,#444466,transparent) !important}
.card[data-s="spawn"]{border-color:#c9a84c88;background:linear-gradient(145deg,#1a1408 0%,var(--panel) 55%);animation:cardIn .26s ease,glowSpawn 1.6s ease-in-out infinite}
.card[data-s="spawn"]::before{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card[data-s="spawn"] .chip{border-color:#c9a84c66}
@keyframes glowSpawn{0%,100%{box-shadow:0 0 18px #c9a84c55}50%{box-shadow:0 0 38px #c9a84caa}}

/* card header row */
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex:1;align-items:center}
.chip{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.5px;padding:3px 12px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);display:inline-flex;align-items:center;gap:5px}
.cl{color:var(--muted);font-size:10px;font-weight:500;letter-spacing:1px}
.cv{color:var(--cream);font-weight:700;font-size:14px}
.card[data-s="p1"]  .chip{border-color:#183328}
.card[data-s="late"] .chip{border-color:#3a1218}
.card[data-s="soon"] .chip{border-color:#4a3800}
.state-badge{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:1.5px;padding:2px 9px;border-radius:10px;border:1px solid currentColor;margin-left:auto;flex-shrink:0}
.badge-wait{color:var(--col-wait);border-color:#2a3566}
.badge-soon{color:var(--col-soon);border-color:#4a3800}
.badge-p1{color:var(--col-p1);border-color:#183328}
.badge-late{color:var(--col-late);border-color:#3a1218}
.badge-miss{color:#666688;border-color:#333355}
.badge-spawn{color:var(--gold);border-color:#c9a84c66}

/* countdown */
.cd-wrap{text-align:center;padding:10px 0 8px}
.cd-num{font-family:var(--mono);font-weight:700;font-size:54px;letter-spacing:-2px;line-height:1;transition:color .4s}
.cd-lbl{font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.5px;margin-top:5px}
.cd-bar-wrap{background:var(--muted2);border-radius:3px;height:3px;overflow:hidden;margin-top:8px}
.cd-bar{height:100%;border-radius:3px;transition:width .9s linear,background .4s}

/* note + footer */
.note-row{font-family:var(--body);font-size:12px;color:var(--soft);background:var(--bg2);border-radius:6px;padding:5px 10px;margin-top:8px}
.ro-label{text-align:center;font-family:var(--body);font-size:10px;font-weight:500;letter-spacing:1px;color:var(--muted2);padding:4px 0 0}

/* countdown bar hide during P1 */
.cd-bar-wrap.hidden{display:none}

/* phase section */
.ph-section{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.ph-section.show{display:block}
.ph-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.ph-elapsed{font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted)}
.ph-spawn-est{font-family:var(--mono);font-size:10px;color:var(--soft)}
.ph-bar-outer{position:relative;background:var(--muted2);border-radius:4px;height:8px;overflow:hidden;margin-bottom:4px}
.ph-bar{height:100%;border-radius:4px;transition:width 1s linear,background .5s;position:relative}
.ph-bar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:rgba(255,255,255,.3);border-radius:0 4px 4px 0}
.ph-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.15)}
.ph-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--muted2);margin-bottom:6px}
.ph-approx{font-family:var(--body);font-size:10px;font-weight:500;color:var(--muted);margin-bottom:4px}
.ph-snap-list{display:flex;flex-wrap:wrap;gap:4px}
.ph-snap-tag{font-family:var(--mono);font-size:10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--soft)}

/* insights panel */
.ins-panel{display:none;background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:14px 18px 10px;margin-bottom:16px;animation:popIn .22s ease}
.ins-panel.show{display:block}
@keyframes popIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ins-title{font-family:var(--disp);font-size:11px;letter-spacing:3px;color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ins-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;margin-left:auto;line-height:1}
.ins-grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.ins-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:170px;flex-shrink:0}
.ins-lv{font-family:var(--disp);font-size:13px;letter-spacing:2px;color:var(--gold);margin-bottom:8px}
.ins-row{font-family:var(--body);font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.ins-val{color:var(--text);font-weight:600;font-family:var(--mono)}
.ins-empty{font-family:var(--body);font-size:12px;color:var(--muted2);padding:10px 0}
.ins-btn{font-family:var(--body);font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px;border:1px solid var(--muted2);background:none;color:var(--muted);cursor:pointer;transition:all .15s}
.ins-btn:hover{border-color:var(--gold);color:var(--gold)}
.ins-btn.on{background:#c9a84c18;border-color:var(--gold);color:var(--gold)}
.ins-card{min-width:220px}
.conf-ad{color:var(--col-p1)}
.conf-lr{color:var(--col-soon)}
.conf-fb{color:var(--muted)}
.ins-segs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.ins-seg{font-family:var(--mono);font-size:10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--soft)}
.ins-trail{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4;word-break:break-word}
.ins-now{font-family:var(--mono);font-size:11px;color:var(--soft);font-weight:400;letter-spacing:0;margin-left:auto}
.ins-close{margin-left:0 !important}
.ins-bk{font-size:9px;color:var(--muted);margin-left:4px}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="logo">
      <span class="logo-leaf">🌿</span>
      <div>
        <div class="logo-name">BOSS TRACKER</div>
        <div class="logo-sub">LIVE VIEWER</div>
      </div>
    </div>
    <div class="hdr-r">
      <span class="count-lbl" id="countLbl">— tracked</span>
      <button class="snd-btn on" id="sndBtn" title="Sound alerts">🔔 Sound</button>
      <input type="range" id="volSlider" class="vol-slider" min="0" max="100" value="50" title="Volume"/>
      <div class="status-pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLbl">CONNECTING</span>
      </div>
    </div>

  <div class="bar">
    <button class="fb on" data-f="ALL">All <span class="fbc" id="fc-ALL"></span></button>

    <button class="fb" data-f="soon">Soon <span class="fbc" id="fc-soon"></span></button>
    <button class="fb" data-f="p1">P1 Active <span class="fbc" id="fc-p1"></span></button>
    <button class="fb" data-f="late">Late <span class="fbc" id="fc-late"></span></button>
    <button class="ins-btn" id="sortBtn" title="Toggle sort">⇅ Soonest</button>
    <button class="ins-btn" id="insBtn">📊 Insights</button>
    <input class="srch" id="srch" placeholder="Search level / channel…"/>
  </div>
</header>

<main>
  <div id="insPanel" class="ins-panel">
    <div class="ins-title">
      INSIGHTS
      <span class="ins-now" id="insNow"></span>
      <button class="ins-close" id="insClose">✕</button>
    </div>
    <div class="ins-grid" id="insGrid"></div>
  </div>
  <div id="empty">No bosses being tracked right now.</div>
  <div id="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ── State ─────────────────────────────────────────────────────
var entries    = {};
var filt       = 'ALL';
var qry        = '';
var tickIv     = null;
var prevStates = {};
var soundOn    = true;
var audioCtx   = null;
var insOpen    = false;
var sortBy     = 'soonest';   // 'soonest' | 'channel'
var knowledge  = {};   // { 'lv145': [{spd, ts, seg, w}, ...] }
var volume     = 0.5;
var prevPhases = {};   // { entryId: lastEstimatedPhase } — for phase-4 alert

// ── Sound ─────────────────────────────────────────────────────
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(notes) {
  if (!soundOn || volume <= 0) return;
  var ctx = getAudioCtx();
  notes.forEach(function(n) {
    var freq = n[0], delay = n[1], dur = n[2], vol = n[3] * volume;
    var osc  = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + dur + 0.05);
  });
}

// ── Sound library ─────────────────────────────────────────────
var SOUND_SOON  = [[660,0,.18,.25],[660,.25,.18,.25]];
var SOUND_P1    = [[880,0,.12,.4],[1047,.18,.14,.4],[1319,.36,.18,.5]];
// Phase 4 alert — three rising tones, pleasant urgency (no harsh frequencies)
var SOUND_P4    = [[880,0,.12,.35],[1047,.16,.12,.35],[1319,.32,.22,.45]];
// Boss respawn fanfare — major triad arpeggio with octave doubling for richness
var SOUND_SPAWN = [
  [523,0,.16,.35],   [1047,0,.16,.18],
  [659,.14,.16,.35], [1319,.14,.16,.18],
  [784,.28,.2,.4],   [1568,.28,.2,.18],
  [1047,.5,.4,.5],   [2093,.5,.4,.18]
];

function checkTransition(id, newState) {
  var prev = prevStates[id];
  prevStates[id] = newState;
  if (!prev || prev === newState) return;
  if      (newState === 'soon')  beep(SOUND_SOON);
  else if (newState === 'p1')    beep(SOUND_P1);
  else if (newState === 'spawn') beep(SOUND_SPAWN);
}

function checkPhaseAlert(id, currentPhase) {
  if (currentPhase === null) return;
  var prev = prevPhases[id];
  prevPhases[id] = currentPhase;
  if (prev === undefined) return;
  // Crossing 4.0 (but not jumping straight to spawn) → P4 alert
  if (prev < 4.0 && currentPhase >= 4.0 && currentPhase < 5.0) beep(SOUND_P4);
}

document.getElementById('sndBtn').addEventListener('click', function() {
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔔 Sound' : '🔕 Sound';
  this.classList.toggle('on', soundOn);
  if (soundOn) getAudioCtx();
});

// Browsers block AudioContext until first user gesture — unlock on any input.
function unlockAudio() {
  var ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  document.removeEventListener('click',   unlockAudio, true);
  document.removeEventListener('keydown', unlockAudio, true);
}
document.addEventListener('click',   unlockAudio, true);
document.addEventListener('keydown', unlockAudio, true);

// Volume slider — persists across sessions
(function initVolume(){
  var slider = document.getElementById('volSlider');
  try {
    var saved = localStorage.getItem('tos_vol');
    if (saved !== null) { slider.value = saved; volume = parseInt(saved) / 100; }
  } catch(_){}
  slider.addEventListener('input', function(){
    volume = parseInt(this.value) / 100;
    try { localStorage.setItem('tos_vol', this.value); } catch(_){}
  });
})();

// ── DB row (snake_case) → entry (camelCase) ───────────────────
function rowToEntry(row) {
  return {
    id:         row.id,
    level:      row.level       || '',
    channel:    row.channel     || '',
    killTime:   row.kill_time   || 0,
    durationMs: row.duration_ms || 0,
    snapshots:  row.snapshots   || [],
    note:       row.note        || '',
    createdAt:  row.created_at  || 0,
    missing:    !!row.missing,
  };
}

// ── State computation (mirrors getState in the Electron app) ──
function getState(e, now) {
  // Boss respawn confirmed: any snapshot at phase 5.0+
  if (e.snapshots && e.snapshots.length > 0) {
    if (e.snapshots[e.snapshots.length - 1].phase >= 5) return { s: 'spawn', rem: null, pct: 1 };
  }
  if (!e.killTime || !e.durationMs) {
    if (e.missing) return { s: 'miss', rem: null, pct: 0 };
    if (e.snapshots && e.snapshots.length > 0) return { s: 'p1', rem: null, pct: 1 };
    return { s: 'wait', rem: null, pct: 0 };
  }
  var elapsed = now - e.killTime;
  var rem     = e.durationMs - elapsed;
  var pct     = Math.min(1, elapsed / e.durationMs);
  var s;
  if      (e.missing)         s = 'miss';
  else if (rem > 5 * 60000)   s = 'wait';
  else if (rem > 0)           s = 'soon';
  else if (rem > -20 * 60000) s = 'p1';
  else                        s = 'late';
  return { s: s, rem: rem, pct: pct };
}

// ── Helpers ───────────────────────────────────────────────────
function pad(n) { return String(Math.floor(Math.abs(n))).padStart(2, '0'); }
function fmtCd(ms) {
  if (ms < 0) ms = 0;
  var s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
  return h > 0 ? pad(h)+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
}
function fmtOver(ms) {
  ms = Math.abs(ms);
  var s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
  return h > 0 ? '+'+pad(h)+':'+pad(m)+':'+pad(s) : '+'+pad(m)+':'+pad(s);
}
function hhmm(ts) { var d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var S_LABEL = { wait:'WAITING', soon:'SOON', p1:'P1 ACTIVE', late:'LATE', miss:'MISSING', spawn:'RESPAWNED' };
var S_BADGE = { wait:'badge-wait', soon:'badge-soon', p1:'badge-p1', late:'badge-late', miss:'badge-miss', spawn:'badge-spawn' };

// ── Bangkok time buckets ──────────────────────────────────────
// Thailand is UTC+7 (no DST). Buckets group hours by player activity.
function bangkokMin(ts) {
  var d = new Date(ts);
  return (d.getUTCHours() * 60 + d.getUTCMinutes() + 7 * 60) % 1440;
}
function bangkokHour(ts) { return Math.floor(bangkokMin(ts) / 60); }
function bangkokTimeStr(ts) {
  var t = bangkokMin(ts);
  return pad(Math.floor(t/60)) + ':' + pad(t%60);
}
function hourBucket(ts) {
  var h = bangkokHour(ts);
  if (h >= 18 && h < 23) return 'peak';
  if (h >= 23 || h < 2)  return 'late';
  if (h >= 2  && h < 8)  return 'sleep';
  return 'day';
}
var BUCKET_LABEL = { peak: '🔥 peak', late: '🌃 late', sleep: '😴 sleep', day: '☀ day' };

// ── Card HTML ─────────────────────────────────────────────────
function cardHTML(e) {
  var st = getState(e, Date.now());
  return [
    '<div class="ch">',
      '<div class="chips">',
        '<div class="chip"><span class="cl">LV</span><span class="cv">'+esc(e.level||'?')+'</span></div>',
        '<div class="chip"><span class="cl">CH</span><span class="cv">'+esc(e.channel||'?')+'</span></div>',
      '</div>',
      '<span class="state-badge '+S_BADGE[st.s]+'">'+S_LABEL[st.s]+'</span>',
    '</div>',
    '<div class="cd-wrap">',
      '<div class="cd-num js-cdnum" style="color:var(--muted)">--:--</div>',
      '<div class="cd-lbl js-cdlbl"></div>',
      '<div class="cd-bar-wrap"><div class="cd-bar js-cdbar" style="width:0%"></div></div>',
    '</div>',
    '<div class="ph-section js-phsec">',
      '<div class="ph-hdr">',
        '<span class="ph-elapsed js-phelapsed"></span>',
        '<span class="ph-spawn-est js-phest"></span>',
      '</div>',
      '<div class="ph-bar-outer">',
        '<div class="ph-bar js-phbar" style="width:0%"></div>',
        '<div class="ph-tick" style="left:25%"></div>',
        '<div class="ph-tick" style="left:50%"></div>',
        '<div class="ph-tick" style="left:75%"></div>',
      '</div>',
      '<div class="ph-labels"><span>P1</span><span>P2</span><span>P3</span><span>P4</span><span>Boss</span></div>',
      '<div class="ph-approx js-phapprox"></div>',
      '<div class="ph-snap-list js-phlist"></div>',
    '</div>',
    e.note ? '<div class="note-row">'+esc(e.note)+'</div>' : '',
    '<div class="ro-label">read-only · live</div>',
  ].join('');
}

// ── Phase helpers ─────────────────────────────────────────────
function phaseColor(ph) {
  if (ph >= 5) return 'var(--gold)';
  if (ph < 2)  return 'var(--col-p1)';
  if (ph < 3)  return '#4ea8de';
  if (ph < 4)  return 'var(--col-soon)';
  return 'var(--col-late)';
}
function phaseName(ph) {
  if (!ph || ph < 1) return 'P1 Active';
  if (ph >= 5)       return '🔥 BOSS!';
  return 'Phase ' + Math.floor(ph);
}

// ── Phase estimation (learning-aware) ─────────────────────────
var DEFAULT_PHASE_SPEED = 3 / (90 * 60000); // 3 phases per 90 min (cold-start fallback)

// Build per-level speed samples from currently-active entry snapshots.
function rebuildKnowledge() {
  knowledge = {};
  Object.keys(entries).forEach(function(k){
    var e = entries[k];
    if (!e.level || !e.snapshots || e.snapshots.length < 2) return;
    var key = 'lv' + e.level;
    if (!knowledge[key]) knowledge[key] = [];
    var snaps = e.snapshots;
    for (var i = 1; i < snaps.length; i++) {
      var dt = snaps[i].time - snaps[i-1].time;
      var dp = snaps[i].phase - snaps[i-1].phase;
      if (dt < 120000 || dp <= 0) continue;
      var spd = dp / dt;
      var segA = Math.floor(snaps[i-1].phase);
      var segB = Math.floor(snaps[i].phase);
      var seg  = (segA === segB) ? segA : 0;
      var ratio = spd / DEFAULT_PHASE_SPEED;
      var w = ratio > 1.2 ? 4 : ratio < 0.8 ? 1 : 2;
      knowledge[key].push({ spd: spd, ts: snaps[i].time, seg: seg, w: w, hb: hourBucket(snaps[i].time) });
    }
  });
}

function decayWeight(ts, now) {
  var age = (now - ts) / 86400000;       // days
  return Math.max(0.2, 1 - age * 0.05);  // 5%/day, floor 0.2
}

function weightedTrimMean(samples, trimPct) {
  if (!samples.length) return null;
  var sorted = samples.slice().sort(function(a,b){ return a.spd - b.spd; });
  var trim = Math.floor(sorted.length * trimPct);
  var kept = sorted.slice(trim, sorted.length - trim);
  if (!kept.length) kept = sorted;
  var totalW = 0, sum = 0;
  kept.forEach(function(s){ totalW += s.w; sum += s.spd * s.w; });
  return totalW > 0 ? sum / totalW : null;
}

function getPhaseSpeed(level, segment, atTime) {
  var raw = knowledge['lv' + level] || [];
  if (!raw.length) return DEFAULT_PHASE_SPEED;
  var now = Date.now();
  var bucket = hourBucket(atTime || now);
  var dec = raw.map(function(s){ return { spd: s.spd, w: s.w * decayWeight(s.ts, now), seg: s.seg, hb: s.hb }; });
  // Cascade: bucket+segment → segment-only → bucket-only → level-global → default
  var bs = dec.filter(function(s){ return s.seg === segment && s.hb === bucket; });
  if (bs.length >= 3) return weightedTrimMean(bs, 0.15) || DEFAULT_PHASE_SPEED;
  var sg = dec.filter(function(s){ return s.seg === segment; });
  if (sg.length >= 3) return weightedTrimMean(sg, 0.15) || DEFAULT_PHASE_SPEED;
  var bk = dec.filter(function(s){ return s.hb === bucket; });
  if (bk.length >= 3) return weightedTrimMean(bk, 0.15) || DEFAULT_PHASE_SPEED;
  if (dec.length >= 3) return weightedTrimMean(dec, 0.15) || DEFAULT_PHASE_SPEED;
  return DEFAULT_PHASE_SPEED;
}

function confidence(level) {
  var n = (knowledge['lv' + level] || []).length;
  if (n >= 8) return { label: '✦ adaptive', n: n, cls: 'conf-ad' };
  if (n >= 3) return { label: '≈ learning', n: n, cls: 'conf-lr' };
  return        { label: '· fallback',  n: n, cls: 'conf-fb' };
}

// Walk forward from (startPh, startT) using segment-specific speeds.
// If untilT is given, stop when reaching it; else walk all the way to phase 5.0.
function walkPhases(startPh, startT, untilT, level) {
  var phase = startPh, t = startT;
  while (phase < 5.0) {
    var segEnd = Math.min(5.0, Math.floor(phase) + 1);
    var spd    = getPhaseSpeed(level, Math.floor(phase), t);
    var dtSeg  = (segEnd - phase) / spd;
    if (untilT !== null && t + dtSeg > untilT) {
      phase += (untilT - t) * spd;
      return { phase: Math.min(5.0, phase), t: untilT };
    }
    t += dtSeg;
    phase = segEnd;
  }
  return { phase: 5.0, t: t };
}

function estimatePhase(e, now) {
  var snaps = e.snapshots || [];
  var seed;
  if (snaps.length > 0) {
    var last = snaps[snaps.length - 1];
    seed = { phase: last.phase, t: last.time };
  } else if (e.killTime && e.durationMs && now >= e.killTime + e.durationMs) {
    seed = { phase: 1.0, t: e.killTime + e.durationMs };
  } else {
    return null;
  }
  return walkPhases(seed.phase, seed.t, now, e.level).phase;
}

function getSpawnAt(e) {
  var snaps = e.snapshots || [];
  var seed;
  if (snaps.length > 0) {
    var last = snaps[snaps.length - 1];
    seed = { phase: last.phase, t: last.time };
  } else if (e.killTime && e.durationMs) {
    seed = { phase: 1.0, t: e.killTime + e.durationMs };
  } else {
    return null;
  }
  return walkPhases(seed.phase, seed.t, null, e.level).t;
}

function getSpawnStddev(e) {
  var snaps = e.snapshots || [];
  var phase, t;
  if (snaps.length) { phase = snaps[snaps.length-1].phase; t = snaps[snaps.length-1].time; }
  else if (e.killTime && e.durationMs) { phase = 1.0; t = e.killTime + e.durationMs; }
  else { phase = 1.0; t = Date.now(); }
  var samples = knowledge['lv' + e.level] || [];
  var totalVar = 0;
  while (phase < 5.0) {
    var segEnd = Math.min(5.0, Math.floor(phase) + 1);
    var spd    = getPhaseSpeed(e.level, Math.floor(phase), t);
    var dt     = (segEnd - phase) / spd;
    var segN   = samples.filter(function(s){ return s.seg === Math.floor(phase); }).length;
    var cv     = segN >= 3 ? 0.20 : 0.40;
    totalVar  += Math.pow(dt * cv, 2);
    t += dt;
    phase = segEnd;
  }
  return Math.sqrt(totalVar);
}

function getEntryRate(e) {
  var snaps = e.snapshots || [];
  if (snaps.length < 2) return null;
  var dp = snaps[snaps.length-1].phase - snaps[0].phase;
  var dt = snaps[snaps.length-1].time  - snaps[0].time;
  return (dt > 0 && dp > 0) ? dp / dt : null;
}

// ── Tick one card ─────────────────────────────────────────────
function tick1(card, e, now) {
  var st = getState(e, now);
  card.dataset.s = st.s;
  checkTransition(e.id, st.s);
  checkPhaseAlert(e.id, estimatePhase(e, now));

  var badge = card.querySelector('.state-badge');
  if (badge) { badge.className = 'state-badge ' + S_BADGE[st.s]; badge.textContent = S_LABEL[st.s]; }

  var cdNum     = card.querySelector('.js-cdnum');
  var cdLbl     = card.querySelector('.js-cdlbl');
  var cdBar     = card.querySelector('.js-cdbar');
  var cdBarWrap = card.querySelector('.cd-bar-wrap');
  var phSec     = card.querySelector('.js-phsec');
  var phElapsed = card.querySelector('.js-phelapsed');
  var phEst     = card.querySelector('.js-phest');
  var phAppr    = card.querySelector('.js-phapprox');
  var phBar     = card.querySelector('.js-phbar');
  var phList    = card.querySelector('.js-phlist');

  var snaps    = e.snapshots || [];
  var hasSnap  = snaps.length > 0;
  var isSpawn  = st.s === 'spawn';
  var isActive = st.s === 'p1' || st.s === 'late';

  // ── Countdown / Phase name display ────────────────────────────
  if (isSpawn) {
    if (cdBarWrap) cdBarWrap.classList.add('hidden');
    if (cdNum) { cdNum.textContent = '🔥 BOSS!'; cdNum.style.color = 'var(--gold)'; cdNum.style.fontSize = '40px'; }
    var spawnAt = 0;
    for (var si = 0; si < snaps.length; si++) {
      if (snaps[si].phase >= 5) { spawnAt = snaps[si].time; break; }
    }
    if (cdLbl) {
      var sinceMs = spawnAt ? now - spawnAt : 0;
      cdLbl.textContent = sinceMs < 60000 ? 'just spawned!' : 'spawned ' + Math.floor(sinceMs / 60000) + 'm ago';
    }
  } else if (isActive) {
    if (cdBarWrap) cdBarWrap.classList.add('hidden');
    var ph = estimatePhase(e, now);
    var phStr = ph !== null ? phaseName(ph) : 'P1 Active';
    var phCol = ph !== null ? phaseColor(ph) : 'var(--col-p1)';
    if (cdNum) { cdNum.textContent = phStr; cdNum.style.color = phCol; cdNum.style.fontSize = '36px'; }
    if (e.killTime && e.durationMs) {
      if (cdLbl) cdLbl.textContent = fmtOver(now - (e.killTime + e.durationMs)) + ' since P1';
    } else {
      if (cdLbl) cdLbl.textContent = 'last snapshot · no kill timer';
    }
  } else if (!e.killTime) {
    if (hasSnap) {
      if (cdBarWrap) cdBarWrap.classList.add('hidden');
      var lastPh = snaps[snaps.length - 1].phase;
      if (cdNum) { cdNum.textContent = phaseName(lastPh); cdNum.style.color = phaseColor(lastPh); cdNum.style.fontSize = '36px'; }
      if (cdLbl) cdLbl.textContent = 'last snapshot · no kill timer';
    } else {
      if (cdBarWrap) cdBarWrap.classList.remove('hidden');
      if (cdNum) { cdNum.textContent = '--:--'; cdNum.style.color = 'var(--muted)'; cdNum.style.fontSize = ''; }
      if (cdLbl) cdLbl.textContent = e.missing ? 'marked missing' : 'awaiting kill data';
      if (cdBar) { cdBar.style.width = '0%'; cdBar.style.background = 'var(--muted2)'; }
    }
  } else if (!e.durationMs) {
    if (cdBarWrap) cdBarWrap.classList.remove('hidden');
    if (cdNum) { cdNum.textContent = 'P1 Active'; cdNum.style.color = 'var(--col-p1)'; cdNum.style.fontSize = '36px'; }
    if (cdLbl) cdLbl.textContent = '';
    if (cdBar) { cdBar.style.width = '100%'; cdBar.style.background = 'var(--col-p1)'; }
  } else {
    if (cdBarWrap) cdBarWrap.classList.remove('hidden');
    var col = st.s === 'soon' ? 'var(--col-soon)' : 'var(--col-wait)';
    if (cdNum) { cdNum.textContent = fmtCd(st.rem); cdNum.style.color = col; cdNum.style.fontSize = ''; }
    if (cdLbl) cdLbl.textContent = 'P1 at ' + hhmm(e.killTime + e.durationMs);
    if (cdBar) { cdBar.style.width = Math.min(100, st.pct * 100).toFixed(1) + '%'; cdBar.style.background = col; }
  }

  // ── Phase section — show when snapshots exist OR boss is active/spawned ──
  var showPhase = hasSnap || isActive || isSpawn;
  if (phSec) phSec.classList.toggle('show', showPhase);

  if (showPhase) {
    var phEst2 = estimatePhase(e, now);
    var barPh  = phEst2 !== null ? phEst2 : (hasSnap ? snaps[snaps.length - 1].phase : null);

    if (barPh !== null) {
      var pct = Math.min(100, ((barPh - 1) / 4) * 100);
      if (phBar) { phBar.style.width = pct.toFixed(1) + '%'; phBar.style.background = phaseColor(barPh); }
    }

    if (phElapsed) {
      if (e.killTime && e.durationMs) {
        var p1Start = e.killTime + e.durationMs;
        if (now >= p1Start) {
          phElapsed.textContent = Math.round((now - p1Start) / 60000) + ' min in P1';
        } else {
          phElapsed.textContent = 'Phase progress';
        }
      } else {
        phElapsed.textContent = hasSnap ? 'Phase snapshots' : '';
      }
    }

    if (phEst) phEst.textContent = phEst2 !== null ? '≈ ' + phEst2.toFixed(1) : '';

    if (phAppr) phAppr.textContent = hasSnap ? '≈ estimated from snapshot' : '≈ estimated from P1 time';

    if (phList) {
      phList.innerHTML = snaps.slice(-5).map(function(s) {
        var ago = Math.round((now - s.time) / 60000);
        return '<span class="ph-snap-tag">P' + s.phase.toFixed(1) + ' · ' + ago + 'm ago</span>';
      }).join('');
    }
  }
}

// ── Sort ──────────────────────────────────────────────────────
function sortScore(e, now) {
  var st = getState(e, now);
  if (st.s === 'spawn') return -1000000;     // pin spawned bosses to top
  if (st.rem !== null && st.rem > 0) return st.rem;
  if (e.killTime && e.durationMs) return (e.killTime + e.durationMs) - now + 1000000;
  return 9999999999;
}
function sortByChannel(a, b) {
  var lvA = parseInt(a.level)   || 0, lvB = parseInt(b.level)   || 0;
  if (lvA !== lvB) return lvA - lvB;
  var chA = parseInt(a.channel) || 0, chB = parseInt(b.channel) || 0;
  return chA - chB;
}
function applySort(list, now) {
  if (sortBy === 'channel') list.sort(sortByChannel);
  else                      list.sort(function(a,b){ return sortScore(a,now) - sortScore(b,now); });
}

// ── Render ────────────────────────────────────────────────────
function renderAll() {
  var grid  = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var now   = Date.now();
  var list  = Object.keys(entries).map(function(k){ return entries[k]; });
  applySort(list, now);

  var counts = { ALL:0, wait:0, soon:0, p1:0, late:0, miss:0, spawn:0 };
  list.forEach(function(e){ counts.ALL++; var s=getState(e,now).s; counts[s]=(counts[s]||0)+1; });

  ['ALL','wait','soon','p1','late'].forEach(function(k){
    var el = document.getElementById('fc-'+k);
    var n  = counts[k] + (k === 'late' ? counts.spawn : 0);   // spawn rolls into late
    if (el) el.textContent = n > 0 ? '('+n+')' : '';
  });
  document.getElementById('countLbl').textContent = counts.ALL + ' tracked';

  var inc = {};
  var filtered = list.filter(function(e){
    var s = getState(e,now).s;
    var fok = filt === 'ALL' || filt === s || (filt === 'late' && s === 'spawn');
    var sq  = ((e.level||'')+(e.channel||'')).toLowerCase();
    var ok  = fok && (!qry || sq.indexOf(qry) !== -1);
    if (ok) inc[e.id] = true;
    return ok;
  });

  if (!filtered.length) { grid.innerHTML = ''; empty.classList.add('show'); return; }
  empty.classList.remove('show');

  Array.from(grid.querySelectorAll('.card')).forEach(function(c){
    if (!inc[c.dataset.id]) c.remove();
  });
  filtered.forEach(function(e){
    if (!grid.querySelector('[data-id="'+e.id+'"]')) {
      var card = document.createElement('div');
      card.className = 'card'; card.dataset.id = e.id; card.dataset.s = 'wait';
      card.innerHTML = cardHTML(e);
      grid.appendChild(card);
    }
  });
  filtered.forEach(function(e, idx){
    var card = grid.querySelector('[data-id="'+e.id+'"]');
    if (!card) return;
    var cur = grid.children[idx];
    if (cur !== card) grid.insertBefore(card, cur || null);
  });

  if (insOpen) renderInsights();
}

// ── Tick loop ─────────────────────────────────────────────────
var _insTick = 0;
function startTick() {
  clearInterval(tickIv);
  tickIv = setInterval(function(){
    var now = Date.now();
    document.querySelectorAll('.card').forEach(function(card){
      var e = entries[card.dataset.id]; if (e) tick1(card, e, now);
    });
    if (insOpen && (++_insTick % 3 === 0)) renderInsights();
  }, 1000);
}

// ── Insights panel ────────────────────────────────────────────
function fmtMin(ms) {
  if (ms < 0) ms = 0;
  var s = Math.round(ms/1000);
  if (s < 60) return s + 's';
  var m = Math.round(ms/60000);
  if (m < 60) return m + 'm';
  return Math.floor(m/60) + 'h ' + (m%60) + 'm';
}
function fmtMinSec(ms) {
  ms = Math.abs(ms);
  var m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
  return m + 'm ' + (s<10?'0':'') + s + 's';
}

function renderInsights() {
  var igrid = document.getElementById('insGrid');
  var inow  = document.getElementById('insNow');
  if (!igrid) return;
  var now  = Date.now();
  if (inow) inow.textContent = 'BKK ' + bangkokTimeStr(now) + ' · ' + BUCKET_LABEL[hourBucket(now)];

  var list = Object.keys(entries).map(function(k){ return entries[k]; });
  var active = list.filter(function(e){ return e.killTime || (e.snapshots && e.snapshots.length > 0); });
  active.sort(function(a, b){ return sortScore(a, now) - sortScore(b, now); });

  if (!active.length) {
    igrid.innerHTML = '<div class="ins-empty">No boss data yet — add kills from the Electron app or Discord bot.</div>';
    return;
  }

  igrid.innerHTML = active.map(function(e) {
    var snaps = e.snapshots || [];
    var phNow = estimatePhase(e, now);
    var spawn = getSpawnAt(e);
    var sd    = getSpawnStddev(e);
    var rate  = getEntryRate(e);
    var conf  = confidence(e.level);

    var phLine    = phNow !== null ? phNow.toFixed(2) : '—';
    var spawnLine = '—';
    if (spawn) {
      var bk = '<span class="ins-bk">' + BUCKET_LABEL[hourBucket(spawn)] + '</span>';
      spawnLine = hhmm(spawn) + ' · ' + (spawn > now ? 'in ' + fmtMin(spawn - now) : fmtMin(now - spawn) + ' ago') + bk;
    }
    var sdLine = (sd && spawn) ? '± ' + fmtMinSec(sd) : '—';

    var rateLine = '—';
    if (rate) {
      rateLine = (rate * 60000).toFixed(2) + ' ph/min (' + (rate / DEFAULT_PHASE_SPEED).toFixed(2) + '× ref)';
    }

    // Per-segment ETAs walking forward, each segment uses its own bucket
    var segLines = [], walkPh = phNow !== null ? phNow : 1.0, walkT = now;
    while (walkPh < 5.0) {
      var segEnd = Math.min(5.0, Math.floor(walkPh) + 1);
      var spd    = getPhaseSpeed(e.level, Math.floor(walkPh), walkT);
      var dt     = (segEnd - walkPh) / spd;
      segLines.push('P' + Math.floor(walkPh) + ' ' + fmtMin(dt));
      walkT += dt;
      walkPh = segEnd;
    }

    var trail = snaps.slice(-4).map(function(s){
      return 'P' + s.phase.toFixed(1) + ' (' + Math.round((now - s.time)/60000) + 'm ago)';
    }).join(' → ');

    return [
      '<div class="ins-card">',
        '<div class="ins-lv">LV'+esc(e.level||'?')+' CH'+esc(e.channel||'?')+'</div>',
        '<div class="ins-row"><span>Phase</span><span class="ins-val">'+phLine+'</span></div>',
        '<div class="ins-row"><span>Spawn</span><span class="ins-val">'+spawnLine+'</span></div>',
        '<div class="ins-row"><span>± window</span><span class="ins-val">'+sdLine+'</span></div>',
        '<div class="ins-row"><span>Rate</span><span class="ins-val">'+rateLine+'</span></div>',
        '<div class="ins-row"><span>Confidence</span><span class="ins-val '+conf.cls+'">'+conf.label+' ('+conf.n+')</span></div>',
        segLines.length ? '<div class="ins-segs">'+segLines.map(function(l){return '<span class="ins-seg">'+l+'</span>';}).join('')+'</div>' : '',
        trail ? '<div class="ins-trail">'+trail+'</div>' : '',
      '</div>',
    ].join('');
  }).join('');
}

document.getElementById('insBtn').addEventListener('click', function(){
  insOpen = !insOpen;
  this.classList.toggle('on', insOpen);
  document.getElementById('insPanel').classList.toggle('show', insOpen);
  if (insOpen) renderInsights();
});
document.getElementById('insClose').addEventListener('click', function(){
  insOpen = false;
  document.getElementById('insBtn').classList.remove('on');
  document.getElementById('insPanel').classList.remove('show');
});

// ── Filter UI ─────────────────────────────────────────────────
document.querySelectorAll('.fb').forEach(function(btn){
  btn.addEventListener('click', function(){
    filt = btn.dataset.f;
    document.querySelectorAll('.fb').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    renderAll();
  });
});
document.getElementById('srch').addEventListener('input', function(){
  qry = this.value.trim().toLowerCase(); renderAll();
});
document.getElementById('sortBtn').addEventListener('click', function(){
  sortBy = sortBy === 'soonest' ? 'channel' : 'soonest';
  this.textContent = sortBy === 'soonest' ? '⇅ Soonest' : '⇅ Channel';
  this.classList.toggle('on', sortBy === 'channel');
  renderAll();
});

// ── Supabase connect ──────────────────────────────────────────
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var statusDot = document.getElementById('statusDot');
var statusLbl = document.getElementById('statusLbl');

function setLive(on) {
  if (on) { statusDot.classList.add('live'); statusLbl.textContent = 'LIVE'; }
  else    { statusDot.classList.remove('live'); statusLbl.textContent = 'OFFLINE'; }
}

async function loadAll() {
  var { data, error } = await sb.from('boss_entries').select('*');
  if (error) { console.error('[viewer] load error', error); return; }
  entries = {};
  (data || []).forEach(function(row){ var e = rowToEntry(row); entries[e.id] = e; });
  rebuildKnowledge();
  renderAll();
}

sb.channel('boss-live')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'boss_entries' }, function(payload){
    if (payload.eventType === 'DELETE') {
      delete entries[payload.old.id];
    } else {
      var e = rowToEntry(payload.new); entries[e.id] = e;
    }
    rebuildKnowledge();
    renderAll();
  })
  .subscribe(function(status){
    setLive(status === 'SUBSCRIBED');
  });

// Boot
loadAll();
startTick();
</script>
